name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name buildforge-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec buildforge-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 2
          done
          docker exec buildforge-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec buildforge-ci-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then break; fi
            sleep 2
          done
      - run: npm run test:integration
        working-directory: backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/buildforge_ci_test?replicaSet=rs0
          JWT_SECRET: ci-only-ephemeral-secret-not-for-production
          ESEWA_SWEEP_INTERVAL_MINUTES: '0'
      - name: Stop disposable test database
        if: always()
        run: docker rm -f buildforge-ci-mongo || true
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api
      - run: docker build -t buildforge:ci .
